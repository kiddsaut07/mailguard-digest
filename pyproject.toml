[project]
name = "mailguard-digest"
version = "0.1.0"
description = "Analyse locale de rapports DMARC agrégés et briefing déterministe."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "Flask>=3.0,<4.0",
    "pydantic>=2.7,<3.0",
    "defusedxml>=0.7.1,<0.8",
    "requests>=2.31,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = ["error::DeprecationWarning:app.*"]

# L'application est exécutée depuis l'arborescence source :
# python -m app.main  (aucune installation en paquet n'est nécessaire).